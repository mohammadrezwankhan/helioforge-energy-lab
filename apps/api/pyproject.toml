[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helioforge-api"
version = "0.3.0"
description = "Auditable energy research, storage dispatch and investment screening."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "numpy==2.3.5",
  "scipy==1.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "pytest-cov>=6,<8"]
ai = ["openai-agents==0.22.3"]

[tool.setuptools.packages.find]
include = ["helioforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
helioforge = ["data/*.json"]
