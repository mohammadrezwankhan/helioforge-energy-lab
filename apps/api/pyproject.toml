[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helioforge-api"
version = "2.0.0"
description = "Auditable energy research, storage dispatch and investment screening."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "shapely==2.2.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "pytest-cov>=6,<8"]
ai = ["openai-agents==0.24.0"]

[tool.setuptools.packages.find]
include = ["helioforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "SIM", "RET", "ARG", "PTH", "PERF", "RUF"]

[tool.setuptools.package-data]
helioforge = ["data/*.json"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
explicit_package_bases = true
files = ["helioforge", "tests"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR"]

[dependency-groups]
dev = [
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.170.14",
  "scipy-stubs==1.17.0.2",
  "types-shapely==2.1.0.20261030",
  "playwright==1.64.1",
  "openai-agents==0.24.0",
]

# Pytest assertions are executable test contracts, never production input validation.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
