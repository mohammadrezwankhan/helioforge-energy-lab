[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helioforge-api"
version = "2.0.0"
description = "Auditable energy research, storage dispatch and investment screening."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "shapely==2.2.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "pytest-cov>=6,<8"]
ai = ["openai-agents==0.24.0"]

[tool.setuptools.packages.find]
include = ["helioforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
helioforge = ["data/*.json"]
