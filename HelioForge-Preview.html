/* Champion edition: an original extension of the existing workbench.
   No web fonts, remote assets or new runtime styling dependency. */
:root {
  --bg:#0a1117; --sidebar:#0a1015; --panel:#111e27; --panel-hover:#182a34;
  --line:#30454e; --text:#eef5f7; --muted:#b0c0c9; --subtle:#96adb9;
  --accent:#c7f397; --teal:#8be1ca; --amber:#ffd38a; --danger:#ffb4a1;
  --radius:14px; --motion-fast:160ms; --motion-medium:240ms;
}
body { background:radial-gradient(ellipse at 85% 0,#17323870,transparent 40%),var(--bg); }
.topbar { background:#0b151ceF; border-color:var(--line); gap:12px; }
.topbar-right { gap:10px; min-width:0; }
.page-heading { margin-bottom:17px; }
h1 { font-weight:600; font-size:27px; }
.beta-label { color:var(--accent); background:#213127; border-color:#40593d; font-size:9px; letter-spacing:.6px; }
.workspace-picker { text-align:left; width:100%; white-space:normal; }
.workspace-picker:hover { border-color:#65876c; }
.page-kicker { color:var(--subtle); letter-spacing:1.6px; }
.data-ribbon { margin-bottom:15px; border-color:#344b49; }
.command-trigger { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--muted); font-size:11px; background:#12212b; min-height:36px; }
.command-trigger:hover { border-color:#72948c; color:var(--text); }
kbd { display:inline-grid; place-items:center; padding:2px 5px; min-width:20px; border:1px solid #58707a; border-radius:4px; color:var(--muted); font:10px 'Segoe UI',Arial,sans-serif; box-shadow:0 1px 0 #000; }
.command-trigger kbd { margin-left:16px; }
.workbench-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; padding:12px 15px; border:1px solid #324950; border-radius:11px; background:linear-gradient(110deg,#172a2a,#101d26); }
.workbench-status { display:flex; align-items:center; gap:11px; min-width:0; }
.workbench-status strong { font-size:12px; font-weight:600; }
.workbench-status small { display:block; font-size:10px; color:var(--muted); margin-top:4px; }
.status-beacon { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px #c7f39712; flex-shrink:0; }
.status-beacon.busy { background:var(--amber); animation:beacon-breathe 1.5s ease-in-out infinite; }
@keyframes beacon-breathe { 50% { box-shadow:0 0 0 7px #ffd38a14; } }
.workbench-actions { display:flex; align-items:center; gap:8px; }
.workbench-actions b { font-size:10px; font-weight:600; background:#ffffff10; border:1px solid #ffffff13; padding:1px 6px; border-radius:5px; }
.workspace-notice { display:flex; align-items:flex-start; gap:9px; padding:10px 13px; margin:-9px 0 18px; border-left:2px solid var(--teal); background:#182b3040; color:var(--muted); font-size:11px; line-height:1.6; }
.workspace-notice>svg { flex-shrink:0; margin-top:2px; color:var(--teal); }
.workspace-notice .icon-button { flex-shrink:0; margin-left:auto; width:25px; height:25px; }
.forge-heading { padding-top:1px; padding-bottom:23px; }
.forge-heading h2 { font-size:38px; letter-spacing:-1.5px; }
.forge-heading h2 em { background:linear-gradient(95deg,#d3f7aa,#8ae1d8); color:transparent; background-clip:text; }
.forge-heading p { max-width:600px; font-size:12px; line-height:1.7; }
.scene-panel { background:radial-gradient(ellipse at 30% 20%,#244a4333,transparent 58%),linear-gradient(155deg,#12232d,#0d1922); border-color:#34545b; }
.configuration-panel { background:linear-gradient(155deg,#182b32,#101d26); }
.configuration-panel .field>span { font-size:11px; color:#c8d7dc; }
.configuration-panel input,.configuration-panel select { background:#0c181f; border-color:#3f5861; }
.configuration-panel input:hover,.configuration-panel select:hover { border-color:#647f81; }
[aria-invalid=true] { border-color:var(--danger)!important; outline-color:var(--danger)!important; }
.input-error-result { border-color:#b47c60; background:#30221f; }
.input-error-result h2 { color:#ffd7c8; }
.draft-note { padding:10px 12px; margin-top:15px; border-left:2px solid var(--amber); color:#f1d6ab; font-size:11px; line-height:1.7; background:#382e1d70; }
.btn,.icon-button,.command-trigger,.scenario-chip,.nav-item { transition:background var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast),transform var(--motion-fast); }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline:2px solid #e0ffaf; outline-offset:3px; }
.scenario-chip { min-height:35px; }
.scenario-chip.active { background:#274233; border-color:#92bf79; color:#e0ffc9; box-shadow:inset 0 0 0 1px #bfe99810; }
.system-card { border-color:#334a55; }
.system-card:hover { border-color:var(--card-color,var(--accent)); background:#1a2c36; }
.hybrid-metric { background:linear-gradient(125deg,#172830,#111d26); }
.hybrid-metric strong { font-variant-numeric:tabular-nums; }
#modal { width:min(740px,calc(100vw - 32px)); max-height:calc(100dvh - 48px); border:1px solid #52716f; border-radius:16px; padding:0; color:var(--text); background:#122029; box-shadow:0 30px 120px #000a; }
#modal::backdrop { background:#02080dbb; backdrop-filter:blur(5px); }
.modal-heading { background:#172a32; border-bottom:1px solid #38525a; padding:19px 23px; position:sticky; top:0; z-index:2; }
.modal-heading h2 { font-size:18px; font-weight:600; }
.modal-copy { padding:24px; font-size:13px; line-height:1.75; }
.modal-copy h3 { font-size:17px; line-height:1.4; }
.modal-copy .notice { line-height:1.65; margin-top:17px; }
.workspace-summary { display:flex; align-items:flex-start; gap:16px; margin-bottom:24px; }
.workspace-summary>span { display:grid; place-items:center; width:48px; height:48px; flex-shrink:0; border-radius:12px; color:var(--accent); background:#314734; border:1px solid #5a7952; }
.workspace-summary h3 { margin:0 0 6px; }
.workspace-summary p { margin:0!important; color:var(--muted); font-size:12px; }
#save-setup-form { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:10px; padding:17px; background:#0c181f; border:1px solid #344d54; border-radius:11px; }
#save-setup-form .field { margin:0; }
#save-setup-form .field>span { font-size:11px; margin-bottom:6px; }
#save-setup-form input { width:100%; }
#save-setup-form .btn { min-height:41px; }
#save-setup-form .form-note { grid-column:1/-1; margin:0; font-size:10px; }
.shelf-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:24px 0 12px; }
.shelf-heading h3 { font-size:14px; }
.shelf-heading .text-link { font-size:11px; }
.setup-list,.run-list { display:flex; flex-direction:column; gap:9px; }

            try {
                data = await response.json();

                throw new Error(body === undefined ? 'The local API returned an unreadable response. Reconnect and try again.' : 'The API response could not be read. Check Analysis history before retrying; the operation may already be saved.');

            }
