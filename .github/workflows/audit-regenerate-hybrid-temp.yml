name: Audit branch hybrid asset regeneration (temporary)

on:
  push:
    branches:
      - audit/helioforge-champion-gates-20261121

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'mohammadrezwankhan/helioforge-energy-lab' && github.actor == 'mohammadrezwankhan'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install authoritative Python engine
        run: python -m pip install -e "apps/api[dev]"
      - name: Regenerate all frozen hybrid outputs
        run: python scripts/generate-hybrid-assets.py
      - name: Verify regenerated numerical and browser artifact integrity
        run: python scripts/check-hybrid-assets.py
      - name: Verify same-runner byte determinism
        run: bash scripts/check-hybrid-repeatability.sh
      - name: Commit generated outputs to the isolated audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/hybrid-bundle.json examples/hybrid-catalog.json examples/hybrid-default.json examples/hybrid-matrix.json apps/web/src/hybrid-data.ts
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "chore(hybrid): refresh source-bound frozen presets after validation fix"
            git push origin HEAD:refs/heads/audit/helioforge-champion-gates-20261121
          fi
