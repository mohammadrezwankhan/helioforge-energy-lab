name: Audit branch browser artifact regeneration (temporary)

on:
  push:
    branches:
      - audit/helioforge-champion-gates-20261121

permissions:
  contents: write

jobs:
  rebuild-frozen-browser:
    if: github.repository == 'mohammadrezwankhan/helioforge-energy-lab' && github.actor == 'mohammadrezwankhan'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        run: cd apps/web && npm ci --ignore-scripts
      - name: Rebuild frontend and standalone distribution
        run: cd apps/web && npm run build
      - name: Recheck preview and generated public site
        run: |
          node scripts/check-preview.mjs
          node scripts/build-domain.mjs
          node scripts/check-domain.mjs
      - name: Commit source-bound compiled assets only to the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- apps/web/dist/ HelioForge-Preview.html
          if git diff --cached --quiet; then
            echo "Compiled distribution is already current."
          else
            git commit -m "chore(hybrid): rebuild source-bound standalone browser distribution"
            git push origin HEAD:refs/heads/audit/helioforge-champion-gates-20261121
          fi
