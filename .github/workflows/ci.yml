name: Verify research release
on:
  push:
    branches: [main, astra/championization]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m ruff check apps/api
      - run: python -m pytest apps/api/tests
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e "apps/api[dev]" playwright
      - run: python -m pytest scripts/test_check_study_assets.py scripts/test_verify_published_release.py scripts/test_acceptance_performance.py
      # Check committed provenance and complete model results without rewriting release bytes.
      # libm results can vary at roundoff level across Windows and Linux.
      - run: python scripts/check-hybrid-assets.py
      # Check solver/BLAS roundoff without rewriting frozen input/result bytes.
      # CI and publication must test the same packaged dataset representation.
      - run: python scripts/check-study-assets.py
      - run: cd apps/web && npm ci --ignore-scripts && npm audit --audit-level=moderate && npm run typecheck && npm run build && npm test
      - run: node scripts/check-preview.mjs && node scripts/build-cloudflare.mjs && node scripts/build-domain.mjs && node scripts/check-domain.mjs && node scripts/acceptance-build-receipt.mjs
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Browser checks against local API
        run: |
          python -m uvicorn helioforge.main:app --host 127.0.0.1 --port 8000 > /tmp/helioforge-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('API did not become ready')
          PY
          python scripts/browser-smoke.py --screenshots
          python scripts/browser-hybrid.py --screenshots
          python scripts/browser-champion.py --screenshots
          python scripts/browser-roadmap.py
          python scripts/browser-completion.py --url http://127.0.0.1:8000
          python scripts/browser-accessibility.py --url http://127.0.0.1:8000
          python scripts/browser-terminal.py --report docs/terminal-audit/browser-terminal-ci.json
          python scripts/browser-full-audit.py --url http://127.0.0.1:8000 --report docs/full-audit/browser-ci.json
          node --test scripts/domain-security.test.mjs scripts/engineering-hero.test.mjs scripts/capability-contract.test.mjs scripts/hosted-data.test.mjs scripts/inline-html.test.mjs
      - name: Hosted data, exports and deferred-response acceptance
        run: |
          python -m http.server 4190 --bind 127.0.0.1 --directory .cloudflare/site > /tmp/helioforge-hosted.log 2>&1 &
          HOSTED_PID=$!
          trap 'kill "$HOSTED_PID"' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4190/app.json', timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Hosted artifact server did not become ready')
          PY
          python scripts/acceptance-hosted.py --url http://127.0.0.1:4190/run/ --site .cloudflare/site --offline-file .cloudflare/site/downloads/HelioForge-Offline.html --evidence-dir docs/remediation-20261030/hosted-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          include-hidden-files: true
          path: |
            docs/*desktop.png
            docs/*mobile.png
            docs/hybrid-compare.png
            docs/learning-studio.png
            docs/hybrid-browser-validation.json
            docs/browser-validation.json
            docs/champion/*.png
            docs/champion/browser-champion.json
            docs/roadmap/browser-validation.json
            docs/roadmap/completion-browser/
            docs/roadmap/accessibility-report.json
            docs/full-audit/browser-ci.json
            docs/terminal-audit/browser-terminal-ci.json
            docs/remediation-20261030/hosted-ci/
            docs/remediation-*/receipts/
            .cloudflare/site/
