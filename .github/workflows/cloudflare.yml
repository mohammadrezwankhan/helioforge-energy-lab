name: Verify Cloudflare browser export
on:
  push:
    branches: [main, astra/cloudflare-browser-apps]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-export-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci --ignore-scripts && npm run build
      - run: node scripts/build-cloudflare.mjs
      - run: node scripts/check-cloudflare.mjs
      - run: node scripts/build-domain.mjs
      - run: node scripts/check-domain.mjs
