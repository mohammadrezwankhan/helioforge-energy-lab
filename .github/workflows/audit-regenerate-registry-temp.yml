name: Audit branch model registry regeneration (temporary)

on:
  push:
    branches:
      - audit/helioforge-champion-gates-20261121

permissions:
  contents: write

jobs:
  regenerate-registry:
    if: github.repository == 'mohammadrezwankhan/helioforge-energy-lab' && github.actor == 'mohammadrezwankhan'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Refresh public model registry from authoritative bundle
        run: node scripts/capability-contract.mjs
      - name: Verify registry digest and source identity
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const bundle = JSON.parse(fs.readFileSync('examples/hybrid-bundle.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('docs/MODEL_REGISTRY.json', 'utf8'));
          assert.equal(registry.identities.data.hybridPresets.sha256, bundle.dataset_sha256);
          assert.equal(registry.identities.data.hybridPresets.caseCount, 285);
          console.log(JSON.stringify({status:'passed',presets:285,sha256:bundle.dataset_sha256}));
          NODE
      - name: Commit generated registry and capability documents on audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MODEL_REGISTRY.json docs/MODEL_REGISTRY.md docs/CAPABILITIES.md
          if git diff --cached --quiet; then
            echo "Registry is already current."
          else
            git commit -m "chore(hybrid): refresh model registry for new bundle digest"
            git push origin HEAD:refs/heads/audit/helioforge-champion-gates-20261121
          fi
