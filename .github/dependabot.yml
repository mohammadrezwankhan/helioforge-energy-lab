# Version updates wait seven days; GitHub exempts security updates from cooldown.
version: 2
updates:
- package-ecosystem: pip
  directory: /apps/api
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  # scipy-stubs 1.18 requires Python >=3.12; the API supports Python 3.11.
  # Keep 1.17 patches and security updates eligible until that support changes.
  ignore:
  - dependency-name: scipy-stubs
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
- package-ecosystem: npm
  directory: /apps/web
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  # CodeQL init/analyze must use the same action version within each workflow.
  groups:
    codeql-action:
      patterns:
      - github/codeql-action/*
- package-ecosystem: pip
  directory: /.github/security
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  # OpenGrep 1.33.1 runtime bounds; revisit when scanner bounds change.
  # Update-type filters keep security updates eligible.
  # Source: https://github.com/dependabot/dependabot-core/blob/05146d8f2a50ea4adf6e00a197c85afae99f7051/common/lib/dependabot/config/ignore_condition.rb
  ignore:
  - dependency-name: boltons
    update-types:
    - version-update:semver-major
  - dependency-name: glom
    update-types:
    - version-update:semver-major
  - dependency-name: peewee
    update-types:
    - version-update:semver-major
  - dependency-name: rich
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  - dependency-name: wcmatch
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  groups:
    development-tooling:
      dependency-type: development
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  # Preserve Node >=22, including 22.0-22.12, and the parser's TypeScript <6 bound.
  # ESLint 10 and visitor-keys 5 (via typescript-eslint >=8.56) raise the Node floor.
  # Update-type filters keep security updates eligible; revisit with runtime support.
  ignore:
  - dependency-name: eslint
    update-types:
    - version-update:semver-major
  - dependency-name: '@eslint/js'
    update-types:
    - version-update:semver-major
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: typescript-eslint
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  # scipy-stubs 1.18 requires Python >=3.12; this project supports Python 3.11.
  # Keep 1.17 patches and security updates eligible until that support changes.
  ignore:
  - dependency-name: scipy-stubs
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
